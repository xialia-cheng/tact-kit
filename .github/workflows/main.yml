name: Build and Release TactKit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Run Unit Tests
        continue-on-error: true
        run: gradle testDebugUnitTest

      - name: Run Lint
        run: gradle lintDebug

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"

      - name: Compute Auto Version (Base-10 Carry)
        id: version
        run: |
          N=$(( ${{ github.run_number }} + 9 ))
          MAJOR=$(( N / 100 ))
          MINOR=$(( (N / 10) % 10 ))
          PATCH=$(( N % 10 ))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ steps.version.outputs.VERSION }} \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/my-upload-key.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="upload" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "TactKit-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TactKit-v${{ steps.version.outputs.VERSION }}"
          path: "TactKit-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          APK="TactKit-v${{ steps.version.outputs.VERSION }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "简工坊 TactKit $TAG" \
              --generate-notes
          fi
